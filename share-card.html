<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>B&K Fragrance share card</title>
    <style>
      html,
      body {
        overflow: hidden;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f0d0b;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 80% 40%,
            rgba(212, 175, 55, 0.28),
            transparent 55%
          ),
          radial-gradient(
            circle at 10% 90%,
            rgba(212, 175, 55, 0.12),
            transparent 50%
          ),
          #0f0d0b;
        color: #f3ead7;
        font-family: Georgia, "Times New Roman", serif;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 90px;
        box-sizing: border-box;
      }

      /* Thin gold frame */
      .card::before {
        content: "";
        position: absolute;
        inset: 24px;
        border: 1px solid rgba(212, 175, 55, 0.35);
        pointer-events: none;
      }

      .text {
        max-width: 620px;
        position: relative;
        z-index: 1;
      }

      .label {
        font-size: 22px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #d4af37;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 84px;
        line-height: 1.05;
        margin: 0 0 28px;
        font-weight: bold;
      }

      h1 em {
        color: #d4af37;
        font-style: italic;
        font-weight: normal;
      }

      .sub {
        font-size: 28px;
        line-height: 1.45;
        color: #c9bba0;
        margin: 0 0 36px;
      }

      .url {
        font-size: 22px;
        letter-spacing: 2px;
        color: #d4af37;
      }

      .mark {
        position: relative;
        z-index: 1;
        width: 380px;
        height: 380px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="label">Signature fragrances</div>
        <h1>Scent that <em>stays</em> with you.</h1>
        <p class="sub">
          Bold, long-lasting perfumes with our name on every bottle.
        </p>
        <div class="url">B&amp;K Fragrance</div>
      </div>

      <svg
        class="mark"
        viewBox="0 0 400 400"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff3c4" />
            <stop offset="45%" stop-color="#d4af37" />
            <stop offset="100%" stop-color="#8a6d1f" />
          </linearGradient>
        </defs>
        <circle
          cx="200"
          cy="200"
          r="185"
          fill="none"
          stroke="url(#g)"
          stroke-width="5"
        />
        <circle
          cx="200"
          cy="200"
          r="165"
          fill="none"
          stroke="#d4af37"
          stroke-width="1"
          stroke-dasharray="3 6"
          opacity="0.6"
        />
        <polygon
          points="200,95 275,150 250,265 150,265 125,150"
          fill="rgba(212,175,55,0.15)"
          stroke="#d4af37"
          stroke-width="5"
        />
        <text
          x="200"
          y="215"
          text-anchor="middle"
          font-family="Georgia, serif"
          font-size="70"
          font-weight="bold"
          fill="url(#g)"
        >
          B&amp;K
        </text>
      </svg>
    </div>
  </body>
</html>
